name: Deploy Python Quest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          node --check app.js
          node --check challenges.js
          node --check platform.js
          node --check python-worker.mjs
          node tests/smoke.cjs
          test -s index.html
          test -s styles.css
          test -s app.js
          test -f favicon.svg
          test -f supabase/schema.sql
          test -f supabase/functions/ai-tutor/index.ts
          test "$(grep -cE '^  \[[0-9]+,' app.js)" -eq 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
