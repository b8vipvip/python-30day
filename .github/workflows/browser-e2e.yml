name: Browser End-to-End

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install headless browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Run browser test with real Pyodide runtime
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/python-quest-http.log 2>&1 &
          node tests/browser.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quest-e2e-screenshots
          path: test-artifacts
          if-no-files-found: ignore
